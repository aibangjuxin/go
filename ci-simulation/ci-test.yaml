# ci-test.yaml —— Cloud Build build config（PR CI 用）
#
# trigger 指向它：
#   --build-config=ci-simulation/ci-test.yaml
#
# 四个 step ↔ Makefile 里的四个 target：
#   install-deps        ↔ make install-deps
#   helm-lint-render    ↔ make test-helm
#   cluster-onboarding  ↔ make test-python
#   bootstrap-tests     ↔ make test-bash
#
# 注意：step 之间**只有 /workspace 共享**，所以依赖装到 ci-simulation/.tools/bin，
#       后续 step 靠 Makefile 里的 PATH 找到它。
steps:
  # ── 0) 安装测试依赖 ───────────────────────────────
  - name: 'ubuntu:22.04'
    id: 'install-deps'
    dir: 'ci-simulation'
    entrypoint: bash
    args:
      - 'scripts/utils/install_ci_dependencies.sh'
    timeout: '600s'

  # ── 1) Helm lint + render ─────────────────────────
  - name: 'ubuntu:22.04'
    id: 'helm-lint-render'
    dir: 'ci-simulation'
    entrypoint: bash
    args: ['-c', 'make test-helm']
    waitFor: ['install-deps']
    timeout: '600s'

  # ── 2) 集群 onboarding 测试 ───────────────────────
  - name: 'ubuntu:22.04'
    id: 'cluster-onboarding'
    dir: 'ci-simulation'
    entrypoint: bash
    args: ['-c', 'make test-python']
    waitFor: ['install-deps']
    timeout: '900s'

  # ── 3) bootstrap 脚本测试 ─────────────────────────
  - name: 'ubuntu:22.04'
    id: 'bootstrap-tests'
    dir: 'ci-simulation'
    entrypoint: bash
    args: ['-c', 'make test-bash']
    waitFor: ['install-deps']
    timeout: '600s'

# ── 全局 ─────────────────────────────────────────────
timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '30'
  logging: 'CLOUD_LOGGING_ONLY'
