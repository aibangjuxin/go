# Air —— 每次保存自动跑测试
#
# 用法：
#   cd daydayup && air -c .air.test.toml
#
# ★ 平时用 `make watch` 就够了（gotestsum --watch，零配置）。
#   这份配置的价值是「和 cr-check 保持同一个动作」——你已经在那边用惯了 air。
#
# 与 cr-check/.air.test.toml 的区别：
#   daydayup 没有常驻服务，只是跑一次性的 go test，所以 cmd 更简单。

root = "."
tmp_dir = "tmp"

[build]
  # 用 sh -c 包装，因为 go test 不是一个常驻二进制。
  # ★ 结尾必须是 cat：air 只看 build.cmd 的退出码，cat 永远返回 0，
  #   测试失败才不会把 air 当成「构建失败」而中断流程。
  # ★ -count=1：跳过 Go 的测试缓存，保证你看到的是「刚跑的结果」而不是 (cached)。
  #   学习阶段最怕「假绿」，这里一律强制重跑。
  cmd = "gotestsum --format testname --raw-command -- go test -count=1 -json ./... > tmp/test.out 2>&1; cat tmp/test.out"
  entrypoint = ["/bin/sh", "-c", "cat tmp/test.out"]

  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", ".git"]
  exclude_unchanged = false
  delay = 200           # 测试比编译慢，防抖给大一点
  stop_on_error = false # 测试失败不杀进程（air 只是重跑一次）
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
